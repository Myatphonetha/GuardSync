CONFIG_GPIO=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Smart Mouthguard"
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1

# The motion packet is 32 bytes. The default Bluetooth packet holds 20,
# so the phone would drop it. 65 leaves room for that packet.
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_BUF_ACL_RX_SIZE=69

# Prints go out the J-Link USB serial port at 115200.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
